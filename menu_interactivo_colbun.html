<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colbún · Portal SIG</title>
<base target="_blank">
<style>
/* =====================================================================
   PORTAL SIG · Subgerencia de Gestión de Patrimonio · Colbún S.A.
   Todo el estilo está acotado a #sig-app para blindarlo contra el CSS
   que ArcGIS Hub inyecta en el iframe.
   ===================================================================== */
:root {
  --azul: #0072bb;
  --azul-900: #00365a;
  --azul-800: #004b7d;
  --azul-700: #005d99;
  --azul-50: #e8f2fa;
  --verde: #6ab43e;
  --verde-700: #4f8f2b;
  --verde-50: #eef7e8;
  --ambar: #d98b00;
  --ambar-50: #fdf3e0;
  --tinta: #12212e;
  --texto: #3b4a57;
  --texto-suave: #6b7a87;
  --borde: #dde5ec;
  --fondo: #f3f6f9;
  --superficie: #ffffff;
  --radio: 10px;
  --sombra-sm: 0 1px 2px rgba(16,33,46,.06), 0 1px 3px rgba(16,33,46,.08);
  --sombra-md: 0 4px 12px rgba(16,33,46,.08), 0 2px 4px rgba(16,33,46,.05);
  --sidebar: 300px;
  --fuente: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
}

html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--fondo); }

#sig-app, #sig-app * { box-sizing: border-box; }
#sig-app {
  font-family: var(--fuente);
  color: var(--texto);
  font-size: 14px;
  line-height: 1.5;
  display: grid;
  grid-template-columns: var(--sidebar) 1fr;
  height: 100vh;
  background: var(--fondo);
  -webkit-font-smoothing: antialiased;
}
/* Neutraliza estilos heredados de Hub sobre botones / enlaces */
#sig-app button, #sig-app a, #sig-app input { all: unset; box-sizing: border-box; font-family: var(--fuente); }
#sig-app svg { flex-shrink: 0; }
#sig-app .ico { width: 16px; height: 16px; }
.scrim { display: none; }
#sig-app :focus-visible { outline: 2px solid var(--verde) !important; outline-offset: 2px; }

/* ============================== SIDEBAR ============================== */
.sb {
  background: linear-gradient(180deg, var(--azul-800) 0%, var(--azul-900) 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid rgba(0,0,0,.15);
}
.sb-brand { display: flex; align-items: center; gap: 12px; padding: 20px 20px 16px; }
.sb-logo {
  width: 38px; height: 38px; border-radius: 9px;
  background: linear-gradient(135deg, var(--verde) 0%, var(--verde-700) 100%);
  display: grid; place-items: center; font-weight: 700; font-size: 18px; color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
.sb-brand h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .2px; color: #fff; line-height: 1.2; }
.sb-brand p { margin: 2px 0 0; font-size: 11.5px; color: rgba(255,255,255,.65); line-height: 1.3; }

.sb-search { padding: 4px 16px 12px; }
.sb-search label {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.14);
  border-radius: 8px; padding: 8px 10px; color: rgba(255,255,255,.7);
  transition: background .15s, border-color .15s;
}
.sb-search label:focus-within { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.35); }
#sig-app .sb-search input { flex: 1; color: #fff; font-size: 13px; min-width: 0; cursor: text; }
#sig-app .sb-search input::placeholder { color: rgba(255,255,255,.55); }
.sb-search kbd {
  font-family: var(--fuente); font-size: 10.5px; color: rgba(255,255,255,.6);
  border: 1px solid rgba(255,255,255,.25); border-radius: 4px; padding: 0 5px;
}

.sb-nav {
  flex: 1; overflow-y: auto; padding: 4px 12px 16px;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent;
}
.sb-nav::-webkit-scrollbar { width: 6px; }
.sb-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.25); border-radius: 3px; }
.sb-group { margin-top: 14px; }
.sb-group-title {
  font-size: 10.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  color: rgba(255,255,255,.5); padding: 0 10px 6px; margin: 0;
}
#sig-app .sb-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; border-radius: 7px; cursor: pointer;
  color: rgba(255,255,255,.86); font-size: 13.5px; line-height: 1.3;
  position: relative; transition: background .15s, color .15s;
}
#sig-app .sb-item:hover { background: rgba(255,255,255,.08); color: #fff; }
#sig-app .sb-item[aria-current="page"] { background: rgba(255,255,255,.14); color: #fff; font-weight: 600; }
#sig-app .sb-item[aria-current="page"]::before {
  content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--verde);
}
.sb-item .ico { width: 18px; height: 18px; opacity: .85; }
.sb-item .lbl { flex: 1; }
.sb-badge {
  font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 10px;
  background: var(--verde); color: #fff; letter-spacing: .3px;
}
.sb-empty { padding: 16px 10px; font-size: 12.5px; color: rgba(255,255,255,.6); }
.sb-foot {
  padding: 12px 20px; font-size: 11px; color: rgba(255,255,255,.5);
  border-top: 1px solid rgba(255,255,255,.08);
}

/* =============================== MAIN =============================== */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  height: 56px; padding: 0 28px; flex-shrink: 0;
  background: var(--superficie); border-bottom: 1px solid var(--borde);
}
#sig-app .menu-btn { display: none; cursor: pointer; padding: 6px; border-radius: 6px; color: var(--tinta); }
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texto-suave); min-width: 0; }
.crumbs strong { color: var(--tinta); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs .ico { width: 14px; height: 14px; }
.topbar .spacer { flex: 1; }
.topbar .org { font-size: 12px; color: var(--texto-suave); white-space: nowrap; }

.view { flex: 1; overflow-y: auto; padding: 28px; }
.view-inner { max-width: 1320px; margin: 0 auto; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.page-head { margin-bottom: 22px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--azul);
}
.page-head h2 { margin: 6px 0 0; font-size: 24px; font-weight: 650; color: var(--tinta); line-height: 1.25; letter-spacing: -.2px; }

.card { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra-sm); }
.card-pad { padding: 22px; }
.card h3 {
  margin: 0 0 14px; font-size: 12px; font-weight: 700; letter-spacing: .8px;
  text-transform: uppercase; color: var(--texto-suave);
}

/* ---- Vista aplicativo: detalle + vista previa ---- */
.app-grid { display: grid; grid-template-columns: minmax(340px, 5fr) minmax(0, 7fr); gap: 22px; align-items: start; }
.app-grid > .col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }

.links { display: flex; flex-direction: column; gap: 10px; }
#sig-app a.lnk {
  display: flex !important; align-items: center; gap: 14px;
  padding: 12px 14px !important; border-radius: 9px;
  border: 1px solid var(--borde) !important; background: var(--superficie) !important;
  color: var(--tinta) !important; text-decoration: none !important; cursor: pointer;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
#sig-app a.lnk:hover { border-color: var(--azul) !important; box-shadow: var(--sombra-md); transform: translateY(-1px); }
.lnk-ico {
  width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center;
  background: var(--azul-50); color: var(--azul);
}
.lnk-ico .ico { width: 20px; height: 20px; }
.lnk[data-tipo="dashboard"] .lnk-ico, .lnk[data-tipo="powerbi"] .lnk-ico { background: var(--verde-50); color: var(--verde-700); }
.lnk[data-tipo="carpeta"] .lnk-ico, .lnk[data-tipo="powerapps"] .lnk-ico { background: var(--ambar-50); color: var(--ambar); }
.lnk-txt { flex: 1; min-width: 0; }
.lnk-txt b { display: block; font-size: 14px; font-weight: 600; color: var(--tinta); }
.lnk-txt span { display: block; font-size: 12px; color: var(--texto-suave); margin-top: 1px; }
.lnk-go { color: var(--texto-suave); transition: color .15s, transform .15s; }
#sig-app a.lnk:hover .lnk-go { color: var(--azul); transform: translate(2px,-2px); }

.desc { font-size: 14px; line-height: 1.7; color: var(--texto); }
.desc p { margin: 0 0 10px; }
.desc p:last-child { margin-bottom: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.tag {
  font-size: 11.5px; padding: 3px 9px; border-radius: 20px;
  background: var(--fondo); border: 1px solid var(--borde); color: var(--texto);
}

.preview { overflow: hidden; }
.preview-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--borde);
}
.preview-head h3 { margin: 0; }
.dots { display: flex; gap: 6px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--borde); display: block; }
#sig-app .preview-img { display: block; cursor: zoom-in; background: var(--fondo); padding: 14px; position: relative; }
.preview-img img { display: block; width: 100%; height: auto; border-radius: 6px; box-shadow: var(--sombra-md); opacity: 0; transition: opacity .35s; }
.preview-img img.ok { opacity: 1; }
.zoom-hint {
  position: absolute; right: 24px; bottom: 24px; display: flex; align-items: center; gap: 6px;
  background: rgba(18,33,46,.78); color: #fff; font-size: 11.5px; padding: 5px 10px; border-radius: 6px;
  opacity: 0; transition: opacity .2s;
}
#sig-app .preview-img:hover .zoom-hint { opacity: 1; }

/* Lightbox */
/* Panel lateral: Manuales y flujo */
.dw-scrim { position: fixed; inset: 0; background: rgba(8,18,28,.45); z-index: 60; display: none; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); z-index: 61;
  background: var(--superficie); box-shadow: -10px 0 40px rgba(8,18,28,.25);
  display: flex; flex-direction: column; transform: translateX(100%); transition: transform .28s ease; visibility: hidden;
}
#sig-app.drawer-open .drawer { transform: none; visibility: visible; }
#sig-app.drawer-open .dw-scrim { display: block; }
.dw-head { padding: 20px 24px 0; border-bottom: 1px solid var(--borde); }
.dw-top { display: flex; align-items: flex-start; gap: 12px; }
.dw-top h2 { margin: 4px 0 0; font-size: 20px; color: var(--tinta); font-weight: 650; }
.dw-top p { margin: 4px 0 0; font-size: 13px; color: var(--texto-suave); }
#sig-app .dw-close { margin-left: auto; padding: 6px; border-radius: 6px; cursor: pointer; color: var(--texto-suave); }
#sig-app .dw-close:hover { background: var(--fondo); color: var(--tinta); }
#sig-app .dw-close .ico { width: 20px; height: 20px; }
.dw-tabs { display: flex; gap: 22px; margin-top: 16px; }
#sig-app .dw-tab { padding: 10px 0; font-size: 13.5px; font-weight: 600; color: var(--texto-suave); cursor: pointer;
  border-bottom: 2px solid transparent; display: inline-flex; align-items: center; gap: 7px; }
#sig-app .dw-tab[aria-selected="true"] { color: var(--azul); border-bottom-color: var(--azul); }
.dw-body { flex: 1; overflow-y: auto; padding: 22px 24px 30px; }
.dw-body [hidden] { display: none !important; }
.callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: 8px; background: var(--ambar-50);
  border-left: 3px solid var(--ambar); font-size: 13px; color: var(--tinta); line-height: 1.55; margin-bottom: 20px; }
.callout .ico { color: var(--ambar); margin-top: 2px; }
.fases { list-style: none; margin: 0; padding: 0; }
.fase { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 14px; position: relative; padding-bottom: 18px; }
.fase:not(:last-child)::after { content: ""; position: absolute; left: 16px; top: 36px; bottom: 4px; width: 2px; background: var(--borde); }
.fase .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px;
  background: var(--azul); color: #fff; box-shadow: 0 0 0 4px var(--azul-50); }
.fase-t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fase-t b { font-size: 14.5px; color: var(--tinta); }
.rol { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: var(--fondo); border: 1px solid var(--borde); color: var(--texto); }
.fase p { margin: 6px 0 0; font-size: 13px; line-height: 1.6; color: var(--texto); }
.fase .ctl { display: flex; gap: 6px; margin-top: 6px; font-size: 12.5px; color: var(--verde-700); line-height: 1.5; }
.fase .ctl .ico { width: 14px; height: 14px; margin-top: 3px; }
#sig-app .fase a.app-ref { display: inline-flex; cursor: pointer; text-decoration: none; align-items: center; gap: 5px; margin-top: 6px; font-size: 12px; color: var(--azul); font-weight: 600; }
#sig-app .fase a.app-ref:hover { text-decoration: underline; }
.fase .app-ref .ico { width: 13px; height: 13px; }
.exc { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
.exc th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--texto-suave); padding: 8px 10px; border-bottom: 1px solid var(--borde); }
.exc td { padding: 9px 10px; border-bottom: 1px solid var(--borde); vertical-align: top; line-height: 1.5; }
.exc td:first-child { font-weight: 600; color: var(--tinta); width: 34%; }
.dw-sub { font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--texto-suave); margin: 26px 0 10px; }
.doc-cards { display: flex; flex-direction: column; gap: 10px; }
#sig-app div.lnk { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 9px;
  border: 1px dashed var(--borde); background: var(--superficie); opacity: .8; }
#sig-app .btn-manual { display: inline-flex !important; align-items: center; gap: 8px; padding: 9px 16px !important; border-radius: 8px;
  background: var(--superficie) !important; border: 1px solid var(--borde) !important; color: var(--azul) !important;
  font-weight: 600; font-size: 13.5px; cursor: pointer; box-shadow: var(--sombra-sm); transition: border-color .15s, box-shadow .15s; white-space: nowrap; }
#sig-app .btn-manual:hover { border-color: var(--azul) !important; box-shadow: var(--sombra-md); }
#sig-app .btn-manual.full { width: 100%; justify-content: center; margin-bottom: 12px; }
.head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.lightbox {
  position: fixed; inset: 0; background: rgba(8,18,28,.88); z-index: 50;
  display: none; align-items: center; justify-content: center; padding: 40px; cursor: zoom-out;
}
.lightbox.open { display: flex; animation: fade .2s ease; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }

/* ========================= MESA DE INCIDENTES ========================= */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
.kpi { padding: 16px 18px; }
.kpi .k-lbl { font-size: 12px; color: var(--texto-suave); font-weight: 600; }
.kpi .k-val { font-size: 26px; font-weight: 700; color: var(--tinta); margin-top: 4px; line-height: 1.1; letter-spacing: -.3px; }
.kpi .k-sub { font-size: 12px; color: var(--texto-suave); margin-top: 4px; }

.mesa-grid { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 22px; align-items: start; }
.mesa-grid > * { min-width: 0; }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar h3 { margin: 0; }
.seg { display: inline-flex; background: var(--fondo); border: 1px solid var(--borde); border-radius: 8px; padding: 3px; }
#sig-app .seg button {
  padding: 5px 12px; font-size: 12.5px; border-radius: 6px; cursor: pointer; color: var(--texto); font-weight: 600;
}
#sig-app .seg button[aria-pressed="true"] { background: var(--superficie); color: var(--azul); box-shadow: var(--sombra-sm); }

.year { border: 1px solid var(--borde); border-radius: var(--radio); background: var(--superficie); margin-bottom: 12px; overflow: hidden; }
#sig-app .year-head {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 18px; cursor: pointer;
  transition: background .15s;
}
#sig-app .year-head:hover { background: var(--fondo); }
.year-head .chev { width: 18px; height: 18px; color: var(--texto-suave); transition: transform .2s; }
.year-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.year-head .y-title { font-size: 16px; font-weight: 650; color: var(--tinta); }
.year-head .y-count { margin-left: auto; font-size: 12px; color: var(--texto-suave); }
.year-body { border-top: 1px solid var(--borde); padding: 6px 18px 18px; }
.year-body[hidden] { display: none; }

.month { margin-top: 14px; }
.month-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.month-head b { font-size: 13px; font-weight: 700; color: var(--tinta); text-transform: capitalize; }
.month-head span { font-size: 12px; color: var(--texto-suave); }
.month-head hr { flex: 1; border: 0; border-top: 1px dashed var(--borde); margin: 0; }

.meet {
  display: grid; grid-template-columns: 58px 1fr auto; gap: 16px; align-items: center;
  padding: 12px 14px; border: 1px solid var(--borde); border-radius: 9px; margin-bottom: 8px;
  transition: border-color .15s, box-shadow .15s;
}
.meet:hover { border-color: #c4d3df; box-shadow: var(--sombra-sm); }
.date {
  text-align: center; border-radius: 8px; overflow: hidden; border: 1px solid var(--borde); background: var(--superficie);
}
.date .d-m { display: block; background: var(--azul); color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: .8px; padding: 2px 0; text-transform: uppercase; }
.date .d-d { display: block; font-size: 20px; font-weight: 700; color: var(--tinta); padding: 2px 0 3px; line-height: 1.2; }
.m-info { min-width: 0; }
.m-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.m-title b { font-size: 14px; color: var(--tinta); font-weight: 600; }
.m-sub { font-size: 12px; color: var(--texto-suave); margin-top: 2px; }
.m-sub::first-letter { text-transform: uppercase; }
.pill { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px; letter-spacing: .4px; }
.pill.G1 { background: var(--azul-50); color: var(--azul-700); }
.pill.G2 { background: var(--verde-50); color: var(--verde-700); }
.m-actions { display: flex; gap: 8px; flex-wrap: wrap; }
#sig-app a.act, #sig-app span.act {
  display: inline-flex !important; align-items: center; gap: 6px; padding: 7px 12px !important;
  border-radius: 7px; font-size: 12.5px; font-weight: 600; white-space: nowrap;
  text-decoration: none !important; cursor: pointer; transition: background .15s, border-color .15s;
}
#sig-app a.act.story { background: var(--azul) !important; color: #fff !important; border: 1px solid var(--azul) !important; }
#sig-app a.act.story:hover { background: var(--azul-700) !important; }
#sig-app a.act.pdf { background: var(--superficie) !important; color: var(--tinta) !important; border: 1px solid var(--borde) !important; }
#sig-app a.act.pdf:hover { border-color: #b3311f !important; color: #b3311f !important; }
#sig-app span.act.off { color: var(--texto-suave); border: 1px dashed var(--borde); cursor: default; background: transparent; }
.act .ico { width: 15px; height: 15px; }

.side-stack { display: flex; flex-direction: column; gap: 22px; }
.last { padding: 20px; background: linear-gradient(135deg, var(--azul-800), var(--azul)); color: #fff; border: 0; }
.last .eyebrow { color: rgba(255,255,255,.75); }
.last .l-date { font-size: 22px; font-weight: 700; margin: 8px 0 2px; }
.last .l-sub { font-size: 13px; color: rgba(255,255,255,.8); }
.last .m-actions { margin-top: 16px; }
#sig-app .last a.act.story { background: #fff !important; color: var(--azul-800) !important; border-color: #fff !important; }
#sig-app .last a.act.pdf { background: transparent !important; color: #fff !important; border-color: rgba(255,255,255,.45) !important; }
#sig-app .last span.act.off { color: rgba(255,255,255,.7); border-color: rgba(255,255,255,.35); }

.mesa-apps { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; margin-bottom: 26px; }
.mapp { overflow: hidden; display: flex; flex-direction: column; }
#sig-app .mapp-thumb {
  display: block; width: 100%; aspect-ratio: 16 / 8; position: relative; overflow: hidden; cursor: zoom-in;
  background: var(--fondo); border-bottom: 1px solid var(--borde);
}

.docs { display: flex; flex-direction: column; gap: 8px; }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const parseFecha = f => { const [y, m, d] = f.split('-').map(Number); return new Date(y, m - 1, d); };

/* ============================ NAVEGACIÓN ============================ */
function renderNav(filtro = '') {
  const q = norm(filtro.trim());
  const html = GRUPOS.map(g => {
    const items = APPS.filter(a => a.grupo === g.id &&
      (!q || norm(a.titulo + ' ' + (a.tags || []).join(' ') + ' ' + (a.desc || '')).includes(q)));
    if (!items.length) return '';
    return `<div class="sb-group"><p class="sb-group-title">${g.titulo}</p>${items.map(a => `
      <button class="sb-item" data-id="${a.id}" title="${esc(a.titulo)}">
        ${ico(a.icono)}<span class="lbl">${esc(a.titulo)}</span>${a.badge ? `<span class="sb-badge">${a.badge}</span>` : ''}
      </button>`).join('')}</div>`;
  }).join('');
  $('#nav').innerHTML = html || '<div class="sb-empty">Sin resultados para la búsqueda.</div>';
  marcarActivo();
}
function marcarActivo() {
  document.querySelectorAll('.sb-item').forEach(b =>
    b.dataset.id === estado.id ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
}

const estado = { id: null, filtroMesa: 'todas', aniosAbiertos: new Set([String(new Date().getFullYear())]) };

function ir(id, { push = true } = {}) {
  const app = APPS.find(a => a.id === id) || APPS[0];
  estado.id = app.id;
  if (push && location.hash !== '#' + app.id) history.replaceState(null, '', '#' + app.id);
  const grupo = GRUPOS.find(g => g.id === app.grupo);
  $('#crumbs').innerHTML = `${ico('home')}<span>${grupo.titulo}</span>${ico('chev')}<strong>${esc(app.titulo)}</strong>`;
  $('#view').innerHTML = `<div class="view-inner">${app.especial === 'mesa' ? vistaMesa(app) : vistaApp(app, grupo)}</div>`;
  $('#view').scrollTop = 0;
  marcarActivo();
  $('#sig-app').classList.remove('nav-open');
  const img = $('#view .preview-img img');
  if (img) (img.complete ? img.classList.add('ok') : img.addEventListener('load', () => img.classList.add('ok')));
}

function accion(url, tipo) {
  const lbl = tipo === 'story' ? 'StoryMap' : 'Minuta PDF';
  const ic = tipo === 'story' ? 'story' : 'pdf';
  return url
    ? `<a class="act ${tipo}" href="${esc(url)}" target="_blank" rel="noopener">${ico(ic)} ${lbl}</a>`
    : `<span class="act off" title="Link aún no cargado">${ico(ic)} ${lbl} · Pendiente</span>`;
}

function vistaMesa(a) {

  const arbol = {};
  lista.forEach(r => {
    const [y, m] = r.fecha.split('-');

  const anios = Object.keys(arbol).sort().reverse().map(y => {
    const abierto = estado.aniosAbiertos.has(y);

          const d = parseFecha(r.fecha);

            <div class="date"><span class="d-m">${MESES[d.getMonth()].slice(0, 3)}</span><span class="d-d">${d.getDate()}</span></div>

              <div class="m-sub">${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}</div>
            </div>
            <div class="m-actions">${accion(r.storymap, 'story')}${accion(r.minuta, 'pdf')}</div>

        }).join('')}

        </section>
      </aside>
    </div>`;
}

/* ======================= PANEL MANUALES Y FLUJO ======================= */
function docCard(d) {
  const inner = `<span class="lnk-ico">${ico(d.tipo === 'PowerPoint' ? 'story' : 'pdf')}</span>
    <span class="lnk-txt"><b>${esc(d.label)}</b><span>${esc(d.detalle)} · ${d.tipo}</span></span>`;
  return d.url
    ? `<a class="lnk" data-tipo="carpeta" href="${esc(d.url)}" target="_blank" rel="noopener">${inner}<span class="lnk-go">${ico('ext')}</span></a>`
    : `<div class="lnk">${inner}<span class="rol">Pendiente</span></div>`;
}
function renderDrawer() {
  const appUrl = k => (MESA.aplicativos[k === 'gestion' ? 0 : 2] || {});
  const fases = FASES_MESA.map(f => {
    const ap = f.app ? appUrl(f.app) : null;
    return `<li class="fase"><span class="num">${f.n}</span><div>
      <div class="fase-t"><b>${esc(f.t)}</b><span class="rol">${esc(f.rol)}</span></div>
      <p>${esc(f.d)}</p>
      <div class="ctl">${ico('check')}<span>${esc(f.c)}</span></div>
      ${ap && ap.url ? `<a class="app-ref" href="${esc(ap.url)}" target="_blank" rel="noopener">${ico('ext')} ${esc(ap.titulo)}</a>` : ''}
    </div></li>`;
  }).join('');
  $('#dwFlujo').innerHTML = `
    <div class="callout">${ico('alert')}<div><b>Regla principal:</b> solo el archivo <b>Minuta_[SESIÓN]_FINAL.pdf</b> se distribuye. Generar o abrir un PDF no equivale a publicarlo, y un flujo exitoso no reemplaza la revisión humana.</div></div>
    <ol class="fases">${fases}</ol>
    <div class="dw-sub">Si algo falla</div>
    <table class="exc"><thead><tr><th>Evento</th><th>Qué hacer</th></tr></thead>
      <tbody>${EXCEPCIONES_MESA.map(([e, h]) => `<tr><td>${esc(e)}</td><td>${esc(h)}</td></tr>`).join('')}</tbody></table>`;
  $('#dwDocs').innerHTML = `
    <div class="doc-cards">${MESA.documentos.map(docCard).join('')}</div>
    ${MESA.carpetaDocumentos ? `<div class="dw-sub">Carpeta</div><div class="doc-cards">
      <a class="lnk" data-tipo="carpeta" href="${esc(MESA.carpetaDocumentos)}" target="_blank" rel="noopener">
        <span class="lnk-ico">${ico('carpeta')}</span><span class="lnk-txt"><b>Documentación del proceso</b><span>SharePoint · Mesa de Incidentes</span></span><span class="lnk-go">${ico('ext')}</span></a></div>` : ''}
    <div class="callout" style="margin-top:20px">${ico('alert')}<div>Los documentos se abren en SharePoint con tu cuenta Colbún. Son de uso interno.</div></div>`;
}
function abrirDrawer(tab = 'flujo') {
  selTab(tab);
  $('#sig-app').classList.add('drawer-open');
  $('#drawer').setAttribute('aria-hidden', 'false');
  setTimeout(() => $('#drawer .dw-close').focus(), 50);
}
function cerrarDrawer() {
  $('#sig-app').classList.remove('drawer-open');
  $('#drawer').setAttribute('aria-hidden', 'true');
}
function selTab(tab) {
  document.querySelectorAll('.dw-tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('#dwFlujo').hidden = tab !== 'flujo';
  $('#dwDocs').hidden = tab !== 'docs';
}

/* ============================== EVENTOS ============================== */
document.addEventListener('click', e => {
  const t = e.target;
  const nav = t.closest('.sb-item');
  if (nav) return ir(nav.dataset.id);

  const rel = t.closest('[data-ir]');
  if (rel) { e.preventDefault(); return ir(rel.dataset.ir); }

  const yh = t.closest('.year-head');
  if (yh) {
    const y = yh.dataset.anio, body = yh.nextElementSibling, abrir = body.hidden;
    body.hidden = !abrir; yh.setAttribute('aria-expanded', abrir);
    abrir ? estado.aniosAbiertos.add(y) : estado.aniosAbiertos.delete(y);
    return;
  }

  const f = t.closest('[data-filtro]');
  if (f) { estado.filtroMesa = f.dataset.filtro; return ir(estado.id, { push: false }); }

  const dw = t.closest('[data-drawer]');
  if (dw) return abrirDrawer(dw.dataset.drawer);
  const tb = t.closest('.dw-tab');
  if (tb) return selTab(tb.dataset.tab);
  if (t.closest('.dw-close') || t.closest('#dwScrim')) return cerrarDrawer();

  const z = t.closest('[data-zoom]');
  if (z) { const lb = $('#lightbox'); lb.querySelector('img').src = z.dataset.zoom; lb.classList.add('open'); return; }

  if (t.closest('#lightbox')) return $('#lightbox').classList.remove('open');
  if (t.closest('#menuBtn')) return $('#sig-app').classList.add('nav-open');
  if (t.closest('#scrim')) return $('#sig-app').classList.remove('nav-open');
});

$('#q').addEventListener('input', e => renderNav(e.target.value));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('#lightbox').classList.remove('open'); $('#sig-app').classList.remove('nav-open'); cerrarDrawer(); }
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
});
window.addEventListener('hashchange', () => ir(location.hash.slice(1), { push: false }));

/* ============================== INICIO ============================== */
document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = ico(el.dataset.icon));
$('#anio').textContent = new Date().getFullYear();
renderNav();
renderDrawer();
ir(location.hash.slice(1) || APPS[0].id, { push: false });
</script>
</body>
</html>
